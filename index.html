<!doctype html>

    <meta property="og:type" content="website" />

          "logo": "%SITE_URL%/og-image.jpg",
          "founder": { "@id": "%SITE_URL%/#javier" },

            "https://github.com/Elizondo613",
            "https://steamcommunity.com/profiles/76561198410903687",

            "https://www.youtube.com/channel/UCGaMiA00t_fUEQvE-D8cozA"
          ]
        },
        {
          "@type": "Person",
          "@id": "%SITE_URL%/#javier",
          "name": "José Javier Elizondo Mendoza",

        {

          "url": "%SITE_URL%/",
          "name": "Kemet Studio",
          "inLanguage": ["es", "en"],
